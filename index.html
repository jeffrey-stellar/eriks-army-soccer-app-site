<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <title>Erik's Army — Soccer Shop Talk</title>
  <meta name="description" content="Erik's Army — old-school soccer match chat. No politics, no BS. Just the futbol." />
  <style>
    body { margin:0; background:#0B1A30; color:#F5F7FA; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:560px; margin:0 auto; padding:72px 20px; text-align:center; }
    .logo { width:148px; height:148px; margin:0 auto 18px; display:block; }
    .brand { font-size:30px; font-weight:800; letter-spacing:.3px; margin:0 0 14px; }
    .tag { font-size:17px; font-weight:700; margin:0; }
    .accent { color:#D4142A; font-weight:800; }
    .links { margin:36px 0 0; }
    .links a { color:#D4142A; display:inline-block; margin:0 10px; font-weight:700; text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .notify { margin:36px 0 0; }
    .notify h2 { font-size:20px; margin:0 0 6px; }
    .notify p { color:#9FB0C9; margin:0 0 16px; font-size:15px; }
    .notify form { display:flex; gap:10px; max-width:420px; margin:0 auto; flex-wrap:wrap; justify-content:center; }
    .notify input { flex:1 1 220px; min-width:0; padding:13px 16px; border-radius:10px; border:1px solid #28425F; background:#0F2238; color:#F5F7FA; font-size:16px; }
    .notify input::placeholder { color:#6E83A3; }
    .notify button { padding:13px 22px; border-radius:10px; border:0; background:#E8B53D; color:#0B1A30; font-weight:800; font-size:16px; cursor:pointer; }
    .notify button:disabled { opacity:.5; cursor:default; }
    .notify .msg { margin-top:14px; color:#2BB673; font-weight:700; min-height:20px; }
    .foot { margin-top:28px; color:#6E83A3; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo.png" alt="Erik's Army" />
    <h1 class="brand">Soccer Shop Talk</h1>
    <p class="tag">Old School Match Chats</p>
    <p class="tag">No Politics, No BS.</p>
    <p class="tag accent">Just the Futbol. ⚽</p>

    <!-- Pre-launch waitlist: JS shows this until LAUNCHED is flipped true below. -->
    <div class="notify" id="notify" hidden>
      <h2>Get in early ⚽</h2>
      <p>We'll email you the moment the app drops.</p>
      <form id="notify-form">
        <input id="notify-email" type="email" name="email" placeholder="you@email.com" required autocomplete="email" />
        <button type="submit" id="notify-btn">Notify me</button>
      </form>
      <p class="msg" id="notify-msg"></p>
    </div>

    <p class="links"><a href="get.html">Get the app</a> · <a href="support.html">Support</a> · <a href="privacy.html">Privacy</a></p>
    <p class="foot">Keep it about the match.<br />© 2026 Stellar Ideas LLC</p>
  </div>

  <script>
    // Same Formspree form as get.html. Flip LAUNCHED to true at launch to hide the
    // waitlist (visitors use "Get the app" instead).
    var FORM_ENDPOINT = 'https://formspree.io/f/xdavypal';
    var LAUNCHED = false; // <-- set true once the app is live in either store

    if (!LAUNCHED && FORM_ENDPOINT.indexOf('REPLACE_') === -1) {
      var notify = document.getElementById('notify');
      var form = document.getElementById('notify-form');
      var emailEl = document.getElementById('notify-email');
      var btn = document.getElementById('notify-btn');
      var msg = document.getElementById('notify-msg');
      notify.hidden = false;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = (emailEl.value || '').trim();
        if (!email) return;
        btn.disabled = true;
        msg.style.color = '#2BB673';
        msg.textContent = 'Signing you up…';
        fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ email: email, source: 'home-page' })
        })
          .then(function (res) {
            if (res.ok) {
              form.hidden = true;
              msg.textContent = "You're on the list — we'll ping you at launch. ⚽";
            } else {
              msg.style.color = '#D4142A';
              msg.textContent = 'Something went wrong — please try again.';
              btn.disabled = false;
            }
          })
          .catch(function () {
            msg.style.color = '#D4142A';
            msg.textContent = 'Something went wrong — please try again.';
            btn.disabled = false;
          });
      });
    }
  </script>
</body>
</html>
