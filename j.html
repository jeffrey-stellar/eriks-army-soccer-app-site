<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <title>Join the match chat — Erik's Army</title>
  <meta name="description" content="You're invited to the match chat on Erik's Army — old-school soccer banter. No politics, no BS. Just the futbol." />
  <style>
    body { margin:0; background:#0B1A30; color:#F5F7FA; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:520px; margin:0 auto; padding:64px 24px; text-align:center; }
    .logo { width:132px; height:132px; margin:0 auto 16px; display:block; }
    .brand { font-size:26px; font-weight:800; letter-spacing:.3px; margin:0 0 6px; }
    .tag { font-size:18px; font-weight:700; margin:0 0 4px; }
    .accent { color:#D4142A; font-weight:800; }
    .room { color:#9FB0C9; font-size:14px; margin:6px 0 32px; }
    .btn { display:block; width:100%; box-sizing:border-box; padding:16px; border-radius:12px; font-size:16px; font-weight:800; text-decoration:none; margin:12px 0; }
    .primary { background:#D4142A; color:#fff; }
    .ghost { background:#13294B; color:#F5F7FA; border:1px solid #24406B; }
    .foot { margin-top:36px; color:#6E83A3; font-size:13px; }
    .foot a { color:#9FB0C9; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo.png" alt="Erik's Army" />
    <h1 class="brand">You're invited 🎟️</h1>
    <p class="tag">Join the match chat on <span class="accent">Erik's Army</span> ⚽</p>
    <p class="room" id="room"></p>

    <a class="btn primary" id="open" href="#">Open in the app</a>
    <a class="btn ghost" href="get.html">Get the app</a>

    <p class="foot">
      Old school. No politics, no BS. Just the futbol.<br />
      <a href="index.html">Home</a> · <a href="get.html">Get the app</a>
    </p>
  </div>

  <script>
    // Read the room from ?r= (format "<matchId>__<topic>"), sanitize, and wire the
    // "Open in the app" button to the app's deep-link scheme. No auto-redirect —
    // a tap avoids the "cannot open page" dialog when the app isn't installed.
    var p = new URLSearchParams(location.search);
    var r = (p.get('r') || '').replace(/[^A-Za-z0-9_-]/g, '');
    var open = document.getElementById('open');
    open.href = r ? 'eriksarmy://room/' + r : 'eriksarmy://';
    // Friendly hint of which room (topic), derived from the id's suffix.
    if (r && r.indexOf('__') > -1) {
      var topic = r.split('__')[1].replace(/-/g, ' ');
      document.getElementById('room').textContent = topic ? 'Room: ' + topic : '';
    }
  </script>
</body>
</html>
