<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <title>Get Erik's Army</title>
  <meta name="description" content="Download Erik's Army — old-school match chat. No politics, no BS. Just the futbol." />
  <style>
    body { margin:0; background:#0B1A30; color:#F5F7FA; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:640px; margin:0 auto; padding:72px 20px; text-align:center; }
    .logo { width:128px; height:128px; margin:0 auto 16px; display:block; }
    h1 { font-size:30px; margin:0 0 4px; }
    .sub { color:#9FB0C9; font-weight:700; margin:0 0 10px; }
    .tag { color:#D4142A; font-weight:800; margin:0 0 36px; }
    .stores { display:flex; flex-direction:column; align-items:center; gap:18px; }
    .store { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .badge { display:inline-block; line-height:0; }
    .badge img { display:block; }
    /* Google's badge has built-in padding, so it needs a bit more height to
       visually balance the tighter Apple badge. */
    .badge.ios img { height:52px; }
    .badge.android img { height:74px; }
    .badge.soon { opacity:.45; pointer-events:none; cursor:default; }
    .soon-cap { color:#9FB0C9; font-size:13px; font-weight:700; }
    .notify { margin-top:40px; }
    .notify h2 { font-size:20px; margin:0 0 6px; }
    .notify p { color:#9FB0C9; margin:0 0 18px; font-size:15px; }
    .notify form { display:flex; gap:10px; max-width:420px; margin:0 auto; flex-wrap:wrap; justify-content:center; }
    .notify input { flex:1 1 220px; min-width:0; padding:13px 16px; border-radius:10px; border:1px solid #28425F; background:#0F2238; color:#F5F7FA; font-size:16px; }
    .notify input::placeholder { color:#6E83A3; }
    .notify button { padding:13px 22px; border-radius:10px; border:0; background:#E8B53D; color:#0B1A30; font-weight:800; font-size:16px; cursor:pointer; }
    .notify button:disabled { opacity:.5; cursor:default; }
    .notify .msg { margin-top:14px; color:#2BB673; font-weight:700; min-height:20px; }
    .foot { margin-top:40px; color:#6E83A3; font-size:14px; }
    .foot a { color:#9FB0C9; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo.png" alt="Erik's Army" />
    <h1>Erik's Army</h1>
    <p class="sub">Soccer Shop Talk</p>
    <p class="tag">Old school. No politics, no BS. Just the futbol. ⚽</p>

    <div class="stores">
      <div class="store">
        <a class="badge ios" id="ios" href="#" aria-label="Download on the App Store">
          <img src="assets/app-store-badge.svg" alt="Download on the App Store" />
        </a>
        <span class="soon-cap" id="ios-soon" hidden>Coming soon</span>
      </div>
      <div class="store">
        <a class="badge android" id="android" href="#" aria-label="Get it on Google Play">
          <img src="assets/google-play-badge.png" alt="Get it on Google Play" />
        </a>
        <span class="soon-cap" id="android-soon" hidden>Coming soon</span>
      </div>
    </div>

    <!-- Pre-launch waitlist: JS shows this only while both stores are "coming soon". -->
    <div class="notify" id="notify" hidden>
      <h2>Get in early ⚽</h2>
      <p>Drop your email and we'll ping you the second the app goes live — just in time for the summer's biggest tournament.</p>
      <form id="notify-form">
        <input id="notify-email" type="email" name="email" placeholder="you@email.com" required autocomplete="email" />
        <button type="submit" id="notify-btn">Notify me</button>
      </form>
      <p class="msg" id="notify-msg"></p>
    </div>

    <p class="foot"><a href="index.html">Home</a> · <a href="support.html">Support</a> · <a href="privacy.html">Privacy</a><br />© 2026 Stellar Ideas LLC</p>
  </div>

  <script>
    // ---- Config: edit these as each store goes live -------------------------
    // Find your Apple App ID in App Store Connect → your app → App Information →
    // "Apple ID" (a number like 6480001234). Then flip IOS_LIVE to true.
    var APPLE_APP_ID  = '6779405729';           // Erik's Army numeric Apple ID
    var ANDROID_PKG   = 'com.eriksarmy.app';    // already correct
    var IOS_LIVE      = true;                    // <-- set true when the App Store listing is live
    var ANDROID_LIVE  = false;                   // <-- set true when the Play listing is live

    // Pre-launch waitlist endpoint. Easiest: create a free form at formspree.io
    // (New form → copy its endpoint, e.g. https://formspree.io/f/abcdwxyz) and paste
    // it here. The form posts {email, source}. Until set, the signup stays hidden.
    var FORM_ENDPOINT = 'https://formspree.io/f/xdavypal';
    // ------------------------------------------------------------------------

    var APP_STORE_URL = 'https://apps.apple.com/app/id' + APPLE_APP_ID;
    var PLAY_URL      = 'https://play.google.com/store/apps/details?id=' + ANDROID_PKG;

    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
    var isAndroid = /Android/.test(ua);

    function setBadge(id, live, url) {
      var el = document.getElementById(id);
      var soon = document.getElementById(id + '-soon');
      if (live) {
        el.href = url;
        el.classList.remove('soon');
        soon.hidden = true;
      } else {
        el.href = '#';
        el.classList.add('soon');
        soon.hidden = false;
      }
    }

    setBadge('ios', IOS_LIVE, APP_STORE_URL);
    setBadge('android', ANDROID_LIVE, PLAY_URL);

    // Auto-send mobile visitors straight to their store when it's live.
    if (isIOS && IOS_LIVE) {
      window.location.replace(APP_STORE_URL);
    } else if (isAndroid && ANDROID_LIVE) {
      window.location.replace(PLAY_URL);
    }
    // Desktop / pre-launch: both badges shown above.

    // ---- Pre-launch waitlist -----------------------------------------------
    // Show the email capture only while NEITHER store is live and an endpoint is set.
    var endpointReady = FORM_ENDPOINT.indexOf('REPLACE_') === -1;
    if (!IOS_LIVE && !ANDROID_LIVE && endpointReady) {
      var notify = document.getElementById('notify');
      var form = document.getElementById('notify-form');
      var emailEl = document.getElementById('notify-email');
      var btn = document.getElementById('notify-btn');
      var msg = document.getElementById('notify-msg');
      notify.hidden = false;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = (emailEl.value || '').trim();
        if (!email) return;
        btn.disabled = true;
        msg.style.color = '#2BB673';
        msg.textContent = 'Signing you up…';
        fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ email: email, source: 'get-page' })
        })
          .then(function (res) {
            if (res.ok) {
              form.hidden = true;
              msg.textContent = "You're on the list — we'll ping you at launch. ⚽";
            } else {
              msg.style.color = '#D4142A';
              msg.textContent = 'Something went wrong — please try again.';
              btn.disabled = false;
            }
          })
          .catch(function () {
            msg.style.color = '#D4142A';
            msg.textContent = 'Something went wrong — please try again.';
            btn.disabled = false;
          });
      });
    }
  </script>
</body>
</html>
